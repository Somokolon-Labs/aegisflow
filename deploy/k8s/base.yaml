apiVersion: v1
kind: Namespace
metadata:
  name: aegisflow
  labels:
    app.kubernetes.io/part-of: aegisflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aegisflow-config
  namespace: aegisflow
data:
  APP_ENV: "kubernetes"
  VERSION: "1.0.0"
  LOG_JSON: "true"
  LOG_LEVEL: "INFO"
  BROKER: "kafka"
  KAFKA_BOOTSTRAP: "redpanda:9092"
  CONSUMER_GROUP: "inference-workers"
  REDIS_ENABLED: "true"
  REDIS_URL: "redis://redis:6379/0"
  ARTIFACTS_DIR: "/app/ml/artifacts"
  GATEWAY_URL: "http://gateway:8000"
  LAB_URL: "http://lab:8100"
  WORKER_CONCURRENCY: "8"
  WORKER_PREFETCH: "24"
  MAX_ATTEMPTS: "4"
  JOB_TIMEOUT_MS: "5000"
  VISIBILITY_TIMEOUT_S: "45"
  RATE_LIMIT_PER_MINUTE: "60000"
  RATE_LIMIT_BURST: "2000"
  CORS_ORIGINS: "*"
---
# Replace with a sealed secret / external secret in a real cluster.
apiVersion: v1
kind: Secret
metadata:
  name: aegisflow-secrets
  namespace: aegisflow
type: Opaque
stringData:
  DATABASE_URL: "postgresql://aegis:aegis@postgres:5432/aegisflow"
  API_KEYS: "demo-key-aegisflow,partner-key-aegisflow"
  ADMIN_API_KEY: "admin-key-aegisflow"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegisflow
  namespace: aegisflow
