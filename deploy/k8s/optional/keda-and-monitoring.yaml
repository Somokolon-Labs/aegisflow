# Applied separately: both need CRDs that a plain cluster does not have.
#   kubectl apply -f deploy/k8s/optional/keda-and-monitoring.yaml
#
# KEDA scales workers on real consumer lag rather than CPU, which is the correct
# signal for a queue-driven service.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
  namespace: aegisflow
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 2
  maxReplicaCount: 30
  pollingInterval: 10
  cooldownPeriod: 120
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 10
          policies: [{ type: Percent, value: 200, periodSeconds: 20 }]
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: redpanda:9092
        consumerGroup: inference-workers
        topic: inference.requests
        lagThreshold: "40"
        offsetResetPolicy: earliest
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring:9090
        metricName: aegisflow_queue_depth
        query: max(aegisflow_queue_depth)
        threshold: "150"
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aegisflow
  namespace: aegisflow
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [aegisflow]
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [gateway, worker, relay, lab]
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
    - port: metrics
      path: /metrics
      interval: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aegisflow-rules
  namespace: aegisflow
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: aegisflow
      rules:
        - alert: AegisflowOutboxNotDraining
          expr: aegisflow_outbox_pending > 100
          for: 2m
          labels: { severity: warning }
          annotations:
            summary: "Outbox is not draining - broker likely unreachable"
        - alert: AegisflowNoWorkers
          expr: count(aegisflow_service_up{service="worker"} == 1) == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "No workers consuming the inference queue"
